<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Base64 Encoder/Decoder - Locally Optimal Tools</title>
    <script>(function(){var t=localStorage.getItem('lo-theme');if(t)document.documentElement.setAttribute('data-theme',t)})()</script>
    <style>
        :root {
            --bg: #ffffff;
            --bg2: #f6f8fa;
            --bg3: #e1e4e8;
            --tx: #333;
            --tx2: #586069;
            --tx3: #6a737d;
            --bd: #d1d5da;
            --bd2: #eee;
            --accent: #0366d6;
            --accent-hover: #0256c7;
            --danger: #d73a49;
            --danger-bg: #ffeef0;
        }
        @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
            --bg: #0d1117;
            --bg2: #161b22;
            --bg3: #21262d;
            --tx: #c9d1d9;
            --tx2: #8b949e;
            --tx3: #6e7681;
            --bd: #30363d;
            --bd2: #21262d;
            --accent: #58a6ff;
            --accent-hover: #79c0ff;
            --danger: #f85149;
            --danger-bg: #3d1117;
        }}
        :root[data-theme="dark"] {
            --bg: #0d1117;
            --bg2: #161b22;
            --bg3: #21262d;
            --tx: #c9d1d9;
            --tx2: #8b949e;
            --tx3: #6e7681;
            --bd: #30363d;
            --bd2: #21262d;
            --accent: #58a6ff;
            --accent-hover: #79c0ff;
            --danger: #f85149;
            --danger-bg: #3d1117;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            max-width: 900px;
            margin: 40px auto;
            padding: 0 20px;
            line-height: 1.6;
            color: var(--tx);
            background: var(--bg);
        }
        h1 {
            border-bottom: 1px solid var(--bd2);
            padding-bottom: 10px;
        }
        .section {
            margin: 30px 0;
        }
        .section h2 {
            font-size: 1.2em;
            margin-bottom: 10px;
        }
        textarea {
            width: 100%;
            min-height: 150px;
            font-family: 'Monaco', 'Menlo', 'Courier New', monospace;
            font-size: 13px;
            padding: 10px;
            border: 1px solid var(--bd);
            border-radius: 4px;
            box-sizing: border-box;
            background: var(--bg);
            color: var(--tx);
        }
        .controls {
            margin: 15px 0;
        }
        button {
            background: var(--accent);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            margin-right: 10px;
        }
        button:hover {
            background: var(--accent-hover);
        }
        .error {
            color: var(--danger);
            margin: 10px 0;
            padding: 10px;
            background: var(--danger-bg);
            border-radius: 4px;
            display: none;
        }
        footer {
            margin-top: 40px;
            padding-top: 20px;
            border-top: 1px solid var(--bd2);
            font-size: 0.9em;
            color: var(--tx2);
        }
        footer a {
            color: var(--accent);
        }
        .theme-toggle {
            position: fixed;
            top: 16px;
            right: 16px;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: 1px solid var(--bd);
            background: var(--bg2);
            color: var(--tx2);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            transition: all 0.2s;
            z-index: 100;
            padding: 0;
        }
        .theme-toggle:hover {
            background: var(--bg3);
            color: var(--tx);
        }
    </style>
</head>
<body>
    <button class="theme-toggle" id="themeToggle" aria-label="Toggle light/dark mode" title="Toggle light/dark mode"></button>
    <h1>Base64 Encoder/Decoder</h1>
    <p>Encode and decode text to/from Base64</p>

    <div class="section">
        <h2>Encode</h2>
        <textarea id="plainText" placeholder="Enter text to encode..."></textarea>
        <div class="controls">
            <button onclick="encode()">Encode to Base64</button>
            <button onclick="clearPlain()">Clear</button>
        </div>
    </div>

    <div class="section">
        <h2>Decode</h2>
        <div id="decodeError" class="error"></div>
        <textarea id="base64Text" placeholder="Enter Base64 to decode..."></textarea>
        <div class="controls">
            <button onclick="decode()">Decode from Base64</button>
            <button onclick="clearBase64()">Clear</button>
        </div>
    </div>

    <footer>
        <p><a href="index.html">&larr; Back to tools</a></p>
    </footer>

    <script>
        const plainText = document.getElementById('plainText');
        const base64Text = document.getElementById('base64Text');
        const decodeError = document.getElementById('decodeError');

        function showError(msg) {
            decodeError.textContent = msg;
            decodeError.style.display = 'block';
        }

        function hideError() {
            decodeError.style.display = 'none';
        }

        function encode() {
            hideError();
            const text = plainText.value;
            if (text) {
                base64Text.value = btoa(text);
            }
        }

        function decode() {
            hideError();
            const encoded = base64Text.value;
            if (encoded) {
                try {
                    plainText.value = atob(encoded);
                } catch (e) {
                    showError('Invalid Base64: ' + e.message);
                }
            }
        }

        function clearPlain() {
            plainText.value = '';
            hideError();
        }

        function clearBase64() {
            base64Text.value = '';
            hideError();
        }
    </script>
    <script>
    (function(){
        function isDark(){
            var t=document.documentElement.getAttribute('data-theme');
            if(t==='dark') return true;
            if(t==='light') return false;
            return matchMedia('(prefers-color-scheme:dark)').matches;
        }
        var btn=document.getElementById('themeToggle');
        function updateIcon(){btn.textContent=isDark()?'\u2600':'\u263E';}
        updateIcon();
        btn.addEventListener('click',function(){
            var next=isDark()?'light':'dark';
            document.documentElement.setAttribute('data-theme',next);
            localStorage.setItem('lo-theme',next);
            updateIcon();
        });
    })();
    </script>
</body>
</html>
