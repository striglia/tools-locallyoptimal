<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Base64 Encoder/Decoder - Locally Optimal Tools</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            max-width: 900px;
            margin: 40px auto;
            padding: 0 20px;
            line-height: 1.6;
            color: #333;
        }
        h1 {
            border-bottom: 1px solid #eee;
            padding-bottom: 10px;
        }
        .section {
            margin: 30px 0;
        }
        .section h2 {
            font-size: 1.2em;
            margin-bottom: 10px;
        }
        textarea {
            width: 100%;
            min-height: 150px;
            font-family: 'Monaco', 'Menlo', 'Courier New', monospace;
            font-size: 13px;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            box-sizing: border-box;
        }
        .controls {
            margin: 15px 0;
        }
        button {
            background: #0366d6;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            margin-right: 10px;
        }
        button:hover {
            background: #0256c7;
        }
        .error {
            color: #d73a49;
            margin: 10px 0;
            padding: 10px;
            background: #ffeef0;
            border-radius: 4px;
            display: none;
        }
        footer {
            margin-top: 40px;
            padding-top: 20px;
            border-top: 1px solid #eee;
            font-size: 0.9em;
            color: #586069;
        }
        footer a {
            color: #0366d6;
        }
    </style>
</head>
<body>
    <h1>Base64 Encoder/Decoder</h1>
    <p>Encode and decode text to/from Base64</p>

    <div class="section">
        <h2>Encode</h2>
        <textarea id="plainText" placeholder="Enter text to encode..."></textarea>
        <div class="controls">
            <button onclick="encode()">Encode to Base64</button>
            <button onclick="clearPlain()">Clear</button>
        </div>
    </div>

    <div class="section">
        <h2>Decode</h2>
        <div id="decodeError" class="error"></div>
        <textarea id="base64Text" placeholder="Enter Base64 to decode..."></textarea>
        <div class="controls">
            <button onclick="decode()">Decode from Base64</button>
            <button onclick="clearBase64()">Clear</button>
        </div>
    </div>

    <footer>
        <p><a href="index.html">← Back to tools</a></p>
    </footer>

    <script>
        const plainText = document.getElementById('plainText');
        const base64Text = document.getElementById('base64Text');
        const decodeError = document.getElementById('decodeError');

        function showError(msg) {
            decodeError.textContent = msg;
            decodeError.style.display = 'block';
        }

        function hideError() {
            decodeError.style.display = 'none';
        }

        function encode() {
            hideError();
            const text = plainText.value;
            if (text) {
                base64Text.value = btoa(text);
            }
        }

        function decode() {
            hideError();
            const encoded = base64Text.value;
            if (encoded) {
                try {
                    plainText.value = atob(encoded);
                } catch (e) {
                    showError('Invalid Base64: ' + e.message);
                }
            }
        }

        function clearPlain() {
            plainText.value = '';
            hideError();
        }

        function clearBase64() {
            base64Text.value = '';
            hideError();
        }
    </script>
</body>
</html>
