<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JSON Formatter - Locally Optimal Tools</title>
    <script>(function(){var t=localStorage.getItem('lo-theme');if(t)document.documentElement.setAttribute('data-theme',t)})()</script>
    <style>
        :root {
            --bg: #ffffff;
            --bg2: #f6f8fa;
            --bg3: #e1e4e8;
            --tx: #333;
            --tx2: #586069;
            --tx3: #6a737d;
            --bd: #d1d5da;
            --bd2: #eee;
            --accent: #0366d6;
            --accent-hover: #0256c7;
            --danger: #d73a49;
            --danger-bg: #ffeef0;
        }
        @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
            --bg: #0d1117;
            --bg2: #161b22;
            --bg3: #21262d;
            --tx: #c9d1d9;
            --tx2: #8b949e;
            --tx3: #6e7681;
            --bd: #30363d;
            --bd2: #21262d;
            --accent: #58a6ff;
            --accent-hover: #79c0ff;
            --danger: #f85149;
            --danger-bg: #3d1117;
        }}
        :root[data-theme="dark"] {
            --bg: #0d1117;
            --bg2: #161b22;
            --bg3: #21262d;
            --tx: #c9d1d9;
            --tx2: #8b949e;
            --tx3: #6e7681;
            --bd: #30363d;
            --bd2: #21262d;
            --accent: #58a6ff;
            --accent-hover: #79c0ff;
            --danger: #f85149;
            --danger-bg: #3d1117;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            max-width: 900px;
            margin: 40px auto;
            padding: 0 20px;
            line-height: 1.6;
            color: var(--tx);
            background: var(--bg);
        }
        h1 {
            border-bottom: 1px solid var(--bd2);
            padding-bottom: 10px;
        }
        textarea {
            width: 100%;
            min-height: 300px;
            font-family: 'Monaco', 'Menlo', 'Courier New', monospace;
            font-size: 13px;
            padding: 10px;
            border: 1px solid var(--bd);
            border-radius: 4px;
            box-sizing: border-box;
            background: var(--bg);
            color: var(--tx);
        }
        .controls {
            margin: 20px 0;
        }
        button {
            background: var(--accent);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            margin-right: 10px;
        }
        button:hover {
            background: var(--accent-hover);
        }
        .error {
            color: var(--danger);
            margin: 10px 0;
            padding: 10px;
            background: var(--danger-bg);
            border-radius: 4px;
            display: none;
        }
        footer {
            margin-top: 40px;
            padding-top: 20px;
            border-top: 1px solid var(--bd2);
            font-size: 0.9em;
            color: var(--tx2);
        }
        footer a {
            color: var(--accent);
        }
        .theme-toggle {
            position: fixed;
            top: 16px;
            right: 16px;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: 1px solid var(--bd);
            background: var(--bg2);
            color: var(--tx2);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            transition: all 0.2s;
            z-index: 100;
            padding: 0;
        }
        .theme-toggle:hover {
            background: var(--bg3);
            color: var(--tx);
        }
    </style>
</head>
<body>
    <button class="theme-toggle" id="themeToggle" aria-label="Toggle light/dark mode" title="Toggle light/dark mode"></button>
    <h1>JSON Formatter</h1>
    <p>Format and validate JSON with syntax highlighting</p>

    <div class="controls">
        <button onclick="formatJSON()">Format</button>
        <button onclick="minifyJSON()">Minify</button>
        <button onclick="clearInput()">Clear</button>
    </div>

    <div id="error" class="error"></div>

    <textarea id="jsonInput" placeholder='Paste your JSON here, e.g. {"name":"value","nested":{"key":123}}'></textarea>

    <footer>
        <p><a href="index.html">&larr; Back to tools</a></p>
    </footer>

    <script>
        const input = document.getElementById('jsonInput');
        const error = document.getElementById('error');

        function showError(msg) {
            error.textContent = msg;
            error.style.display = 'block';
        }

        function hideError() {
            error.style.display = 'none';
        }

        function formatJSON() {
            hideError();
            try {
                const parsed = JSON.parse(input.value);
                input.value = JSON.stringify(parsed, null, 2);
            } catch (e) {
                showError('Invalid JSON: ' + e.message);
            }
        }

        function minifyJSON() {
            hideError();
            try {
                const parsed = JSON.parse(input.value);
                input.value = JSON.stringify(parsed);
            } catch (e) {
                showError('Invalid JSON: ' + e.message);
            }
        }

        function clearInput() {
            input.value = '';
            hideError();
        }
    </script>
    <script>
    (function(){
        function isDark(){
            var t=document.documentElement.getAttribute('data-theme');
            if(t==='dark') return true;
            if(t==='light') return false;
            return matchMedia('(prefers-color-scheme:dark)').matches;
        }
        var btn=document.getElementById('themeToggle');
        function updateIcon(){btn.textContent=isDark()?'\u2600':'\u263E';}
        updateIcon();
        btn.addEventListener('click',function(){
            var next=isDark()?'light':'dark';
            document.documentElement.setAttribute('data-theme',next);
            localStorage.setItem('lo-theme',next);
            updateIcon();
        });
    })();
    </script>
</body>
</html>
